<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Catcher</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    /* 480x640 (3:4), shrunk to fit smaller screens */
    width: min(480px, 100vw, 75vh);
    height: auto;
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 480, H = 640;
  var GAME_TIME = 60, START_LIVES = 3;
  var BASKET_W = 80, BASKET_H = 24, BASKET_Y = H - 50, BASKET_SPEED = 380;
  var BASE_FALL = 150, FALL_STEP = 25, SPAWN_EVERY = 0.6, ROCK_CHANCE = 0.3;

  var state = 'start'; // 'start' | 'play' | 'over'
  var score, lives, timeLeft, items, basketX, spawnTimer, overAt = 0;
  var keys = { left: false, right: false };
  var best = loadBest();

  // Fixed background dots so the sky does not flicker
  var sky = [];
  for (var i = 0; i < 40; i++) sky.push([Math.random() * W, Math.random() * H, Math.random() * 1.5 + 0.5]);

  function loadBest() {
    try { return parseInt(localStorage.getItem('starCatcherBest'), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem('starCatcherBest', String(best)); } catch (e) {}
  }

  function startGame() {
    score = 0; lives = START_LIVES; timeLeft = GAME_TIME;
    items = []; basketX = W / 2; spawnTimer = 0;
    state = 'play';
  }

  function endGame() {
    state = 'over';
    overAt = performance.now();
    if (score > best) { best = score; saveBest(); }
  }

  // Start / restart; short pause after game over avoids accidental restarts
  function tryStart() {
    if (state === 'play') return;
    if (state === 'over' && performance.now() - overAt < 500) return;
    startGame();
  }

  function fallSpeed() { return BASE_FALL + FALL_STEP * Math.floor(score / 10); }

  function spawn() {
    var r = 14;
    items.push({
      x: r + Math.random() * (W - 2 * r), y: -r, r: r,
      rock: Math.random() < ROCK_CHANCE
    });
  }

  function update(dt) {
    if (state !== 'play') return;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); return; }

    if (keys.left) basketX -= BASKET_SPEED * dt;
    if (keys.right) basketX += BASKET_SPEED * dt;
    basketX = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, basketX));

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = SPAWN_EVERY; }

    var speed = fallSpeed();
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += speed * dt;
      var caught = it.y + it.r >= BASKET_Y && it.y - it.r <= BASKET_Y + BASKET_H &&
                   Math.abs(it.x - basketX) <= BASKET_W / 2 + it.r * 0.5;
      if (caught) {
        items.splice(i, 1);
        if (it.rock) { lives--; if (lives <= 0) { endGame(); return; } }
        else score++;
      } else if (it.y - it.r > H) {
        items.splice(i, 1);
      }
    }
  }

  // ---------- drawing ----------
  function drawStar(x, y, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 === 0 ? r : r * 0.45;
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffd83b';
    ctx.fill();
  }

  function drawRock(x, y, r) {
    var shape = [1, 0.8, 0.95, 0.75, 1, 0.85, 0.9, 0.78];
    ctx.beginPath();
    for (var i = 0; i < shape.length; i++) {
      var a = i * Math.PI * 2 / shape.length;
      ctx.lineTo(x + Math.cos(a) * r * shape[i], y + Math.sin(a) * r * shape[i]);
    }
    ctx.closePath();
    ctx.fillStyle = '#d93636';
    ctx.fill();
    ctx.strokeStyle = '#7a1414';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawBasket() {
    var l = basketX - BASKET_W / 2, r = basketX + BASKET_W / 2;
    ctx.beginPath();
    ctx.moveTo(l, BASKET_Y);
    ctx.lineTo(r, BASKET_Y);
    ctx.lineTo(r - 10, BASKET_Y + BASKET_H);
    ctx.lineTo(l + 10, BASKET_Y + BASKET_H);
    ctx.closePath();
    ctx.fillStyle = '#b5762a';
    ctx.fill();
    ctx.fillStyle = '#e0a04a';
    ctx.fillRect(l - 3, BASKET_Y - 4, BASKET_W + 6, 6);
  }

  function text(str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px sans-serif';
    ctx.fillStyle = color || '#fff';
    ctx.textAlign = align || 'center';
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.fillStyle = '#0b1030';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#39406e';
    for (var i = 0; i < sky.length; i++) ctx.fillRect(sky[i][0], sky[i][1], sky[i][2], sky[i][2]);

    if (state === 'start') {
      drawStar(W / 2, 200, 48);
      text('Star Catcher', W / 2, 310, 48, '#ffd83b');
      text('Press Space to start', W / 2, 380, 22);
      return;
    }

    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      if (it.rock) drawRock(it.x, it.y, it.r); else drawStar(it.x, it.y, it.r);
    }
    drawBasket();

    // HUD
    text('Score: ' + score, 12, 28, 18, '#fff', 'left');
    text('Lives: ' + lives, W / 2, 28, 18, '#ff8a8a', 'center');
    text('Time: ' + Math.ceil(timeLeft), W - 12, 28, 18, '#fff', 'right');

    if (state === 'over') {
      ctx.fillStyle = 'rgba(5, 6, 15, 0.75)';
      ctx.fillRect(0, 0, W, H);
      text('Game Over', W / 2, 240, 46, '#ffd83b');
      text('Final score: ' + score, W / 2, 300, 26);
      text('Best score: ' + best, W / 2, 340, 22, '#c9d0ff');
      text('Press Space to play again', W / 2, 410, 22);
    }
  }

  // ---------- input ----------
  window.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    else if (e.code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    else if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) tryStart(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft') keys.left = false;
    else if (e.code === 'ArrowRight') keys.right = false;
  });

  function touchMove(e) {
    e.preventDefault();
    if (state !== 'play') return;
    var rect = canvas.getBoundingClientRect();
    basketX = (e.touches[0].clientX - rect.left) * W / rect.width;
    basketX = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, basketX));
  }
  canvas.addEventListener('touchstart', function (e) {
    // No Space key on phones, so a tap starts / restarts the game
    if (state !== 'play') { e.preventDefault(); tryStart(); return; }
    touchMove(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', touchMove, { passive: false });

  // ---------- main loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
