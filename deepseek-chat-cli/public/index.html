<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">DeepSeek Chat</div>
      <button id="newChatBtn" class="new-chat-btn">+ New Chat</button>
      <div class="model-label">Model: <span id="modelName">deepseek-flash</span></div>
      <button id="settingsBtn" class="settings-btn">Settings</button>
    </aside>

    <main class="main">
      <div id="messages" class="messages"></div>

      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Message DeepSeek..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h2>Settings</h2>
      <label>DeepSeek API key</label>
      <input id="apiKeyInput" type="password" placeholder="sk-..." />
      <label>Model</label>
      <input id="modelInput" type="text" placeholder="deepseek-flash" />
      <div class="modal-actions">
        <button id="saveSettingsBtn">Save</button>
        <button id="closeSettingsBtn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
