<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Simple Paint</title>
<style>
  :root {
    --bg: #1f2230; --panel: #2a2e42; --panel-2: #353a54; --text: #e8eaf6;
    --muted: #9aa0c0; --accent: #6c8cff; --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
    -webkit-user-select: none; user-select: none; }
  #app { display: flex; height: 100%; }

  /* ---------- Toolbar ---------- */
  #toolbar { width: 128px; flex: none; background: var(--panel); padding: 10px 8px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px; box-shadow: 2px 0 12px rgba(0,0,0,.3); z-index: 2; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group h4 { margin: 0; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 2px solid transparent;
    border-radius: var(--radius); padding: 7px 4px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 3px; transition: background .15s, border-color .15s, opacity .15s; }
  button:hover:not(:disabled) { background: #444a6c; }
  button.active { border-color: var(--accent); background: #3b4470; }
  button:disabled { opacity: .35; cursor: default; }
  button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  input[type=color] { width: 100%; height: 34px; border: 0; padding: 0; background: none; cursor: pointer;
    border-radius: 8px; }
  .size-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  #swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #swatches i { aspect-ratio: 1; border-radius: 5px; cursor: pointer; border: 1px solid rgba(255,255,255,.2); }
  #save { background: var(--accent); color: #fff; }
  #save:hover { background: #8aa3ff !important; }

  /* ---------- Canvas ---------- */
  #wrap { flex: 1; position: relative; overflow: hidden; background: #fff; margin: 10px; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.4); touch-action: none; cursor: crosshair; }
  canvas { position: absolute; left: 0; top: 0; touch-action: none; }
  #ring { position: fixed; pointer-events: none; border: 1px solid #000; border-radius: 50%;
    box-shadow: 0 0 0 1px #fff; transform: translate(-50%, -50%); display: none; z-index: 5; }

  /* ---------- Narrow screens: toolbar on top ---------- */
  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #toolbar { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 14px;
      padding: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .group { flex: none; min-width: 96px; }
    #wrap { margin: 6px; }
    .group h4 { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="toolbar">
    <div class="group">
      <h4>Tool</h4>
      <div class="row">
        <button id="tBrush" class="active" title="Brush">
          <svg viewBox="0 0 24 24"><path d="M18 3l3 3-9.5 9.5-3-3z"/><path d="M8.5 12.5C6 12.5 5 14 5 16c0 1.5-1 2.500-2 3 3 1.500 8 1 8-3"/></svg>Brush</button>
        <button id="tEraser" title="Eraser">
          <svg viewBox="0 0 24 24"><path d="M20 20H9L3.500 14.500a2 2 0 010-3l8-8a2 2 0 013 0l5.500 5.500a2 2 0 010 3L13 19"/><path d="M7 11l6 6"/></svg>Eraser</button>
      </div>
    </div>

    <div class="group" id="typeGroup">
      <h4>Brush type</h4>
      <button data-type="round" class="active" title="Round brush">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>Round</button>
      <button data-type="air" title="Soft / airbrush">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="6" stroke-dasharray="1 3"/><circle cx="12" cy="12" r="9" stroke-dasharray="1 4"/></svg>Airbrush</button>
      <button data-type="water" title="Watercolor">
        <svg viewBox="0 0 24 24"><path d="M12 3s6 6.500 6 11a6 6 0 01-12 0c0-4.500 6-11 6-11z"/></svg>Watercolor</button>
    </div>

    <div class="group">
      <h4>Size</h4>
      <input type="range" id="size" min="1" max="50" value="12">
      <div class="size-label"><span>1</span><b id="sizeVal">12 px</b><span>50</span></div>
    </div>

    <div class="group">
      <h4>Color</h4>
      <input type="color" id="color" value="#2b59ff" title="Brush color">
      <div id="swatches"></div>
    </div>

    <div class="group">
      <h4>Background</h4>
      <input type="color" id="bgColor" value="#ffffff" title="Background color">
    </div>

    <div class="group">
      <h4>Actions</h4>
      <div class="row">
        <button id="undo" title="Undo (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Undo</button>
        <button id="redo" title="Redo (Ctrl+Y)" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>Redo</button>
      </div>
      <button id="clear" title="Clear canvas">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Clear</button>
      <button id="save" title="Save as PNG">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>Save PNG</button>
    </div>
  </aside>

  <div id="wrap"><canvas id="cv"></canvas></div>
</div>
<div id="ring"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const wrap = $('wrap'), cv = $('cv'), ctx = cv.getContext('2d'), ring = $('ring');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let tool = 'brush', type = 'round', size = 12, color = '#2b59ff', bg = '#ffffff';

  /* ---------- Canvas sizing (grows only, never loses drawing) ---------- */
  function resize() {
    const r = wrap.getBoundingClientRect();
    const w = Math.max(cv.width, Math.round(r.width * dpr));
    const h = Math.max(cv.height, Math.round(r.height * dpr));
    if (w === cv.width && h === cv.height) return;
    let old = null;
    if (cv.width) {
      old = document.createElement('canvas'); old.width = cv.width; old.height = cv.height;
      old.getContext('2d').drawImage(cv, 0, 0);
    }
    cv.width = w; cv.height = h;
    cv.style.width = w / dpr + 'px'; cv.style.height = h / dpr + 'px';
    if (old) ctx.drawImage(old, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = ctx.lineJoin = 'round';
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- Undo / redo ---------- */
  const MAX_HISTORY = 20;
  let undoStack = [], redoStack = [];
  const snap = () => ctx.getImageData(0, 0, cv.width, cv.height);
  function restore(img) { ctx.clearRect(0, 0, cv.width, cv.height); ctx.putImageData(img, 0, 0); }
  function pushUndo() {
    undoStack.push(snap());
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
    updateButtons();
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snap()); restore(undoStack.pop()); updateButtons();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snap()); restore(redoStack.pop()); updateButtons();
  }
  function updateButtons() {
    $('undo').disabled = !undoStack.length;
    $('redo').disabled = !redoStack.length;
  }

  /* ---------- Brush rendering ---------- */
  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  }
  function stamp(x, y) {
    const r = size / 2;
    ctx.globalCompositeOperation = 'source-over';
    if (type === 'air') {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(color, 0.14)); g.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    } else { // watercolor: a few jittered, translucent blobs that build up where they overlap
      for (let k = 0; k < 3; k++) {
        const a = Math.random() * 6.283, d = Math.random() * r * 0.3;
        const cx = x + Math.cos(a) * d, cy = y + Math.sin(a) * d, rr = r * (0.8 + Math.random() * 0.25);
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
        g.addColorStop(0, rgba(color, 0.012)); g.addColorStop(0.8, rgba(color, 0.03));
        g.addColorStop(1, rgba(color, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
      }
    }
  }
  function dot(p) {
    if (tool === 'eraser' || type === 'round') {
      ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(p.x, p.y, size / 2, 0, 7); ctx.fill();
    } else stamp(p.x, p.y);
  }
  // Draw a smooth quadratic curve a -> m using c as control point.
  function curve(a, c, m) {
    if (tool === 'eraser' || type === 'round') {
      ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = color; ctx.lineWidth = size;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(c.x, c.y, m.x, m.y); ctx.stroke();
    } else {
      const len = Math.hypot(c.x - a.x, c.y - a.y) + Math.hypot(m.x - c.x, m.y - c.y);
      const step = Math.max(1, size * 0.12), n = Math.max(1, Math.ceil(len / step));
      for (let i = 1; i <= n; i++) {
        const t = i / n, u = 1 - t;
        stamp(u * u * a.x + 2 * u * t * c.x + t * t * m.x, u * u * a.y + 2 * u * t * c.y + t * t * m.y);
      }
    }
  }

  /* ---------- Pointer input (mouse, touch, pen) ---------- */
  let drawing = false, pid = null, last = null, lastMid = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  wrap.addEventListener('pointerdown', e => {
    if (drawing || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    drawing = true; pid = e.pointerId;
    pushUndo();
    last = lastMid = pos(e);
    dot(last);
  });
  wrap.addEventListener('pointermove', e => {
    moveRing(e);
    if (!drawing || e.pointerId !== pid) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (events.length ? events : [e])) {
      const p = pos(ev), mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
      curve(lastMid, last, mid);
      last = p; lastMid = mid;
    }
  });
  function end(e) {
    if (!drawing || e.pointerId !== pid) return;
    curve(lastMid, last, last);
    drawing = false; pid = null;
    ctx.globalCompositeOperation = 'source-over';
  }
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  wrap.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- Cursor ring showing brush size ---------- */
  function moveRing(e) {
    if (e.pointerType !== 'mouse') { ring.style.display = 'none'; return; }
    ring.style.display = 'block';
    ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
  }
  wrap.addEventListener('pointerleave', () => ring.style.display = 'none');
  function sizeRing() { ring.style.width = ring.style.height = Math.max(size, 3) + 'px'; }

  /* ---------- UI wiring ---------- */
  function setTool(t) {
    tool = t;
    $('tBrush').classList.toggle('active', t === 'brush');
    $('tEraser').classList.toggle('active', t === 'eraser');
    $('typeGroup').style.opacity = t === 'eraser' ? .4 : 1;
  }
  $('tBrush').onclick = () => setTool('brush');
  $('tEraser').onclick = () => setTool('eraser');

  document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    type = b.dataset.type; setTool('brush');
    document.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('active', x === b));
  });

  $('size').oninput = e => { size = +e.target.value; $('sizeVal').textContent = size + ' px'; sizeRing(); };
  $('color').oninput = e => { color = e.target.value; if (tool === 'eraser') setTool('brush'); };
  $('bgColor').oninput = e => { bg = e.target.value; wrap.style.background = bg; };

  ['#000000', '#ffffff', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'].forEach(c => {
    const s = document.createElement('i'); s.style.background = c; s.title = c;
    s.onclick = () => { color = c; $('color').value = c; setTool('brush'); };
    $('swatches').appendChild(s);
  });

  $('undo').onclick = undo;
  $('redo').onclick = redo;
  $('clear').onclick = () => { pushUndo(); ctx.clearRect(0, 0, cv.width, cv.height); };
  $('save').onclick = () => {
    const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d');
    o.fillStyle = bg; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, 0);
    out.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'painting.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  window.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
  });

  sizeRing();
})();
</script>
</body>
</html>
